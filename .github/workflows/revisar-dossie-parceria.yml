name: Remover referencia academica nao formalizada do PDF

on:
  push:
    branches: [live-site]
    paths:
      - .github/workflows/revisar-dossie-parceria.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar-dossie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-site
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyMuPDF
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2'

      - name: Remover declaracao de parceria do dossie
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fitz
          import os
          import re

          source = "assets/programa-regenmed.pdf"
          output = source + ".revisado"
          doc = fitz.open(source)
          pages = len(doc)
          erased = 0

          for page in doc:
              text = page.get_text()
              if not re.search(r"Carlos\s+Chagas", text, re.IGNORECASE):
                  continue

              # Exclui somente a linha que identifica a instituicao
              # ainda nao formalizada, sem modificar o programa curricular.
              lines = []
              for block in page.get_text("dict")["blocks"]:
                  if "lines" not in block:
                      continue
                  for line in block["lines"]:
                      text_line = "".join(span.get("text", "") for span in line["spans"])
                      if re.search(r"Carlos\s+Chagas|Instituto Superior de Ci[eê]ncias", text_line, re.I):
                          bounds = fitz.Rect(line["bbox"])
                          lines.append((text_line, bounds))
              if not lines:
                  raise RuntimeError(f"Referencia encontrada, mas nao localizada visualmente na pagina {page.number + 1}")
              for line_text, bounds in lines:
                  print(f"Pagina {page.number + 1}: retirando linha institucional {line_text!r}")
                  page.add_redact_annot(bounds + (-1, -1, 1, 1), fill=(1, 1, 1))
                  erased += 1
              page.apply_redactions(images=0, graphics=0, text=0)

          if erased == 0:
              raise RuntimeError("O dossie original nao contem a referencia esperada; nenhuma alteracao feita")
          doc.save(output, garbage=4, deflate=True, clean=True)
          doc.close()

          check = fitz.open(output)
          if len(check) != pages:
              raise RuntimeError("Quantidade de paginas mudou")
          fulltext = "\n".join(page.get_text() for page in check)
          if re.search(r"Carlos\s+Chagas|Instituto\s+Superior\s+de\s+Ci[eê]ncias", fulltext, re.I):
              raise RuntimeError("A referencia a parceria continua presente")
          if not re.search(r"REG[EE]NMED|RegenMed", fulltext, re.I):
              raise RuntimeError("Identidade da RegenMed ausente apos revisao")
          print(f"Revisado: {pages} paginas, {erased} linha(s) removida(s)")
          check.close()
          os.replace(output, source)
          PY

      - name: Registrar PDF revisado na live-site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/programa-regenmed.pdf
          if git diff --cached --quiet; then
            echo "Sem alteracoes no PDF"
            exit 0
          fi
          git commit -m "Remove referencia academica nao formalizada do dossie"
          git push origin HEAD:live-site
